<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard Vuelos</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- noUiSlider -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/nouislider@15.8.1/dist/nouislider.min.css">

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <!-- Estilos -->
    <link rel="stylesheet" href="/css/style.css">

    <link rel="stylesheet" href="/css/sidebar.css">

</head>

<body>

<div id="mainContent" class="main-content">

    <div class="container-fluid py-4">

    <!-- Encabezado -->

    <div class="row mb-4">

        <div class="col-12">

            <div class="header">

                <div class="header-top">

                    <button id="btnMenu" class="btn-menu">

    <i class="fa-solid fa-bars"></i>

</button>

<div id="overlay" class="overlay"></div>

<div id="sidebar-container"></div>

                    <h2>

                        <i class="fa-solid fa-plane"></i>

                        Dashboard de Vuelos

                    </h2>

                </div>

                <p>

                    Sistema de análisis de vuelos en Estados Unidos

                </p>

            </div>

        </div>

    </div>

    <!-- ========================= -->
<!-- FILTROS -->
<!-- ========================= -->

<div class="row mt-3">

    <div class="col-lg-12">

        <div class="filter-card">

            <!-- ===================== -->
<!-- RANGO DE AÑOS -->
<!-- ===================== -->

<div class="mb-4">

    <label class="filter-title">

        Rango de años

    </label>

    <div id="sliderAnios"></div>

    <div class="slider-info">

        <span id="lblAnioInicio">

            0

        </span>

        <span id="lblAnioFin">

            0

        </span>

    </div>

</div>

<!-- ===================== -->
<!-- RANGO DE MESES -->
<!-- ===================== -->

<div class="mb-4">

    <label class="filter-title">

        Rango de meses

    </label>

    <div id="sliderMeses"></div>

    <div class="slider-info">

        <span id="lblMesInicio">

            Enero

        </span>

        <span id="lblMesFin">

            Diciembre

        </span>

    </div>

</div>

            <div class="row mt-4">

                <div class="col-md-5">

                    <label>

                        Aerolínea

                    </label>

                    <select
                        id="cmbAerolinea"
                        class="form-select">

                    </select>

                </div>

                <div class="col-md-5">

                    <label>

                        Franja Horaria

                    </label>

                    <select
                        id="cmbFranja"
                        class="form-select">

                    </select>

                </div>

                <div class="col-md-2 d-flex align-items-end">

                    <button
                        id="btnLimpiar"
                        class="btn btn-primary w-100">

                        Limpiar

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- KPIs -->

<div class="row mt-4 g-4">

    <div class="col-lg-2 col-md-4">

        <div class="kpi-card">

            <div class="kpi-icon">

                <i class="fa-solid fa-plane"></i>

            </div>

            <div>

                <h6>Total Vuelos</h6>

                <h3 id="kpiTotal">0</h3>

            </div>

        </div>

    </div>

    <div class="col-lg-2 col-md-4">

        <div class="kpi-card">

            <div class="kpi-icon">

                <i class="fa-solid fa-route"></i>

            </div>

            <div>

                <h6>Millas</h6>

                <h3 id="kpiMillas">0</h3>

            </div>

        </div>

    </div>

    <div class="col-lg-2 col-md-4">

        <div class="kpi-card">

            <div class="kpi-icon">

                <i class="fa-solid fa-clock"></i>

            </div>

            <div>

                <h6>Puntualidad</h6>

                <h3 id="kpiPuntualidad">0%</h3>

            </div>

        </div>

    </div>

    <div class="col-lg-2 col-md-4">

        <div class="kpi-card">

            <div class="kpi-icon">

                <i class="fa-solid fa-location-arrow"></i>

            </div>

            <div>

                <h6>Desviados</h6>

                <h3 id="kpiDesviados">0</h3>

            </div>

        </div>

    </div>

    <div class="col-lg-2 col-md-4">

        <div class="kpi-card">

            <div class="kpi-icon">

                <i class="fa-solid fa-ban"></i>

            </div>

            <div>

                <h6>Cancelados</h6>

                <h3 id="kpiCancelados">0%</h3>

            </div>

        </div>

    </div>

    <div class="col-lg-2 col-md-4">

        <div class="kpi-card">

            <div class="kpi-icon">

                <i class="fa-solid fa-hourglass-half"></i>

            </div>

            <div>

                <h6>Retrasados</h6>

                <h3 id="kpiRetrasados">0%</h3>

            </div>

        </div>

    </div>

</div>

<!--Grafico de Pastel-->

<div class="row mt-4">

    <div class="col-lg-5">

        <div class="chart-card">

            <h5>Estado del Vuelo</h5>

            <div class="chart-container">

                <canvas id="graficaEstado"></canvas>

            </div>

        </div>

    </div>

    <div class="col-lg-7">

        <div class="chart-card">

            <h5>% Retrasados por Estado</h5>

            <div id="mapaEstados"></div>

        </div>

    </div>

</div>

<!--Grafica de Linead-->

<div class="row mt-4">

    <div class="col-12">

        <div class="chart-card">

            <h5 class="mb-3">

                Total de Vuelos por Mes y Año

            </h5>

            <div class="chart-container">

    <canvas id="graficaVuelosMes"></canvas>

</div>

        </div>

    </div>

</div>

</div><!--este div no se toca-->

</div>

<script src="https://cdn.jsdelivr.net/npm/nouislider@15.8.1/dist/nouislider.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="js/charts.js"></script>

<script src="/js/sidebar.js"></script>

<script src="js/sidebarLoader.js"></script>

<script src="js/app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
